input {
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # Enrich logs with timestamp and add custom fields
  mutate {
    add_field => { "[@metadata][index_name]" => "road-accident-logs" }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index_name]}-%{+YYYY.MM.dd}"
  }
  
  # Also print to stdout for debugging
  stdout {
    codec => rubydebug
  }
}
