<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Road Safety Login</title>
  <style>
    :root {
      --bg: #070c1a;
      --panel: rgba(13, 18, 36, 0.96);
      --text: #e9f0ff;
      --muted: #9db3d5;
      --accent: #6cf0c2;
      --accent2: #7fc4ff;
      --border: rgba(255, 255, 255, 0.1);
      --danger: #ff5f6d;
      --ok: #5ce1a9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #102040 0%, #070c1a 45%, #04070f 100%);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 18px;
    }
    .card {
      width: min(520px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    }
    h1 { margin: 0 0 8px 0; font-size: 26px; }
    p { margin: 0 0 14px 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      outline: none;
    }
    input:focus { border-color: var(--accent2); }
    .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button {
      border: none;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }
    .primary { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #041023; }
    .secondary { background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid var(--border); }
    .msg { margin-top: 12px; font-size: 12px; padding: 9px; border-radius: 10px; border: 1px solid var(--border); }
    .msg.info { color: var(--muted); }
    .msg.ok { color: var(--ok); border-color: rgba(92,225,169,0.3); background: rgba(92,225,169,0.08); }
    .msg.err { color: var(--danger); border-color: rgba(255,95,109,0.3); background: rgba(255,95,109,0.08); }
    .hint { margin-top: 8px; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Secure Sign In</h1>
    <p>Create an account or log in to continue to the protected Road Safety dashboard.</p>
    <div class="row">
      <input id="username" type="text" placeholder="Username" autocomplete="username" />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    </div>
    <div class="actions">
      <button class="secondary" onclick="signup()">Create account</button>
      <button class="primary" onclick="login()">Log in</button>
    </div>
    <div id="msg" class="msg info">Sign in required to access /ui.</div>
    <div class="hint">After successful login, you will be redirected automatically.</div>
  </div>

  <script>
    function setMsg(text, kind) {
      const el = document.getElementById('msg');
      el.className = 'msg ' + kind;
      el.textContent = text;
    }

    function creds() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      return { username, password };
    }

    async function signup() {
      const { username, password } = creds();
      if (!username || !password) {
        setMsg('Username and password are required.', 'err');
        return;
      }
      setMsg('Creating account...', 'info');
      try {
        const res = await fetch('/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || 'Signup failed');
        setMsg('Account created. Now click Log in.', 'ok');
      } catch (e) {
        setMsg(e.message, 'err');
      }
    }

    async function login() {
      const { username, password } = creds();
      if (!username || !password) {
        setMsg('Username and password are required.', 'err');
        return;
      }
      setMsg('Signing in...', 'info');
      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || 'Login failed');
        if (data.access_token) {
          try { localStorage.setItem('sppAuthToken', data.access_token); } catch (e) {}
        }
        setMsg('Login successful. Redirecting...', 'ok');
        window.location.href = '/ui';
      } catch (e) {
        setMsg(e.message, 'err');
      }
    }
  </script>
</body>
</html>
